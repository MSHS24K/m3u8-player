<script async="">
  // ১. আপনার দেওয়া মূল কোডটি প্রথমে স্বাভাবিকভাবে লোড হবে
  var playerInstance = jwplayer('video-html-element-id-1').setup({
    'playlist': [{
      'file': '#', 
      'mediaid': 'NaMt7pLL',
      'type': 'application/x-mpegURL',
      'image': 'https://i.imgur.com/9gImDY5.png',

  // ২. নতুন অটোমেটিক প্লে লজিক (বাটন ছাড়া)
  document.getElementById('video-url-input').addEventListener('input', function() {
    var userUrl = this.value.trim();
    
    // লিংকটি যদি কমপক্ষে ১০ অক্ষরের বড় হয় (একটি সাধারণ লিংকের ন্যূনতম দৈর্ঘ্য)

      playerInstance.load([{
        'file': userUrl,
        'mediaid': 'NaMt7pLL',
        'type': 'application/x-mpegURL', 
        'image': 'https://i.imgur.com/9gImDY5.png',
        'adServerTarget': 'ex.sections/23436;url=2020-10-28-Qual-e-a-estrategia-portuguesa-para-a-descarbonizacao-'
      }]);
      
      playerInstance.play();
    }
  });
</script>
